name: Check research results

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s src -p 'test_*.py' -v
      - run: python src/run.py check
      - name: Independent 84-contrast and bootstrap audit
        run: python src/audit/independent_ci.py --root .
      - name: Independently verify exploratory metric-coupling and length artifacts
        run: python src/analysis/metric_relationships.py --root . --verify
      - name: Verify ArchiveLens independent 1885/1888 sampling estimands
        run: |
          python src/archivelens/audit.py --data data/TxtLangFiles1870-1894_TB.zip --out results/archivelens --figures results/figures --report reports/ARCHIVELENS_RESULTS_2026-10-26.md --verify
          python src/archivelens/verify_independent.py --data data/TxtLangFiles1870-1894_TB.zip --out results/archivelens
      - name: Verify ArchiveLens follow-up calibration and attribution (4,999 permutations)
        run: |
          python src/archivelens/followup.py --data data/TxtLangFiles1870-1894_TB.zip --root . --verify
          python src/archivelens/verify_followup.py --data data/TxtLangFiles1870-1894_TB.zip --root .
      - name: Verify supplementary page-position figure from original archive
        run: |
          python paper/analysis/make_supp_figure.py --archive data/TxtLangFiles1870-1894_TB.zip --outdir paper
          git diff --exit-code -- paper/analysis/supp_page_position_summary.csv
          test -s paper/supp_page_position_compact.pdf
      - run: python src/run.py reproduce --data data/source-not-included.zip --out /tmp/replay --dry-run

  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Generate verified paper figures from committed results and original ZIP
        run: |
          cd paper
          python make_figures.py
          python analysis/make_supp_figure.py --archive ../data/TxtLangFiles1870-1894_TB.zip --outdir .
          git diff --exit-code -- analysis/supp_page_position_summary.csv
      - name: Compile complete research paper and standalone supplement
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            report.tex
            supplement_preview.tex
          working_directory: paper
          texlive_version: 2024
      - name: Verify page limits and assignment section ordering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python - <<'PY'
          from pathlib import Path
          import subprocess
          report=Path("paper/report.pdf")
          supplement=Path("paper/supplement_preview.pdf")
          assert report.stat().st_size>20000
          assert supplement.stat().st_size>15000
          pages=subprocess.check_output(["pdfinfo",str(supplement)],text=True)
          assert any(line.startswith("Pages:") and line.split(":")[1].strip()=="3" for line in pages.splitlines()), pages
          text=subprocess.check_output(["pdftotext","-layout",str(report),"-"],text=True)
          sections=["References","NeurIPS Paper Checklist","Supplementary Material","Contribution Statement"]
          positions=[text.find(x) for x in sections]
          assert all(p>=0 for p in positions) and positions==sorted(positions), positions
          assert text.count("Question:")>=15, text.count("Question:")
          body=subprocess.check_output(["pdftotext","-f","1","-l","2",str(report),"-"],text=True)
          assert "Discussion" in body
          assert all(x not in body for x in sections[1:]), "Research body exceeded two pages"
          print("PASS: paper order, two-page research body, 15 NeurIPS questions, three-page supplement")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Project2-assembled-paper-without-private-declaration
          path: paper/report.pdf
