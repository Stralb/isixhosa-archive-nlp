name: Check research results

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s src -p 'test_*.py' -v
      - run: python src/run.py check
      - name: Independent 84-contrast and bootstrap audit
        run: python src/audit/independent_ci.py --root .
      - name: Independently verify exploratory metric-coupling and length artifacts
        run: python src/analysis/metric_relationships.py --root . --verify
      - name: Verify ArchiveLens independent 1885/1888 sampling estimands
        run: |
          python src/archivelens/audit.py --data data/TxtLangFiles1870-1894_TB.zip --out results/archivelens --figures results/figures --report reports/ARCHIVELENS_RESULTS_2026-10-26.md --verify
          python src/archivelens/verify_independent.py --data data/TxtLangFiles1870-1894_TB.zip --out results/archivelens
      - name: Verify ArchiveLens follow-up calibration and attribution (4,999 permutations)
        run: |
          python src/archivelens/followup.py --data data/TxtLangFiles1870-1894_TB.zip --root . --verify
          python src/archivelens/verify_followup.py --data data/TxtLangFiles1870-1894_TB.zip --root .
      - name: Verify supplementary page-position figure from original archive
        run: |
          python paper/analysis/make_supp_figure.py --archive data/TxtLangFiles1870-1894_TB.zip --outdir paper
          git diff --exit-code -- paper/analysis/supp_page_position_summary.csv
          test -s paper/supp_page_position_compact.pdf
      - run: python src/run.py reproduce --data data/source-not-included.zip --out /tmp/replay --dry-run
