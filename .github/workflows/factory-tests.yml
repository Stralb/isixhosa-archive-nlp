name: Factory unit tests
on:
  push:
    paths:
      - "factory/**"
      - "requirements.txt"
      - ".github/workflows/factory-tests.yml"
  pull_request:
    paths:
      - "factory/**"
      - "requirements.txt"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s factory/tests -v
      - run: python -m py_compile factory/run_experiment.py
