name: Saved research reproduction checks

on:
  push:
    paths:
      - "releases/**"
      - "docs/SAVED_OUTPUT_CHUNKS.csv"
      - "scripts/restore_saved_outputs.py"
      - "scripts/restore_saved_artifacts.py"
      - "scripts/verify_saved_results.py"
      - "scripts/recalculate_saved_contrasts.py"
      - "scripts/factory.py"
      - "coursework/**"
      - ".github/workflows/saved-results.yml"
  pull_request:
    paths:
      - "releases/**"
      - "docs/SAVED_OUTPUT_CHUNKS.csv"
      - "scripts/restore_saved_outputs.py"
      - "scripts/restore_saved_artifacts.py"
      - "scripts/verify_saved_results.py"
      - "scripts/recalculate_saved_contrasts.py"
      - "scripts/factory.py"
      - "coursework/**"

jobs:
  saved-output-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify model and numerical archive checksums
        run: python scripts/factory.py check-archives
      - name: Restore all saved research artifacts
        run: |
          python scripts/restore_saved_artifacts.py
          python scripts/restore_saved_outputs.py
      - name: Independently check the original scientific claims
        run: |
          python scripts/check_frozen_source.py
          python scripts/verify_saved_results.py
          python scripts/recalculate_saved_contrasts.py
