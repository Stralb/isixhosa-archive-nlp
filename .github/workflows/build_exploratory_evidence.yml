name: Build exploratory research evidence

on:
  push:
    branches:
      - research/exploratory-metric-coupling-2026-10-26
    paths:
      - .github/workflows/build_exploratory_evidence.yml
      - src/analysis/metric_relationships.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate both post-hoc analyses and figures
        shell: bash
        run: |
          set -euo pipefail
          if python src/analysis/metric_relationships.py --root . > /tmp/exploratory_run.log 2>&1; then
            cat /tmp/exploratory_run.log
          else
            cat /tmp/exploratory_run.log
            cp /tmp/exploratory_run.log reports/_temporary_exploratory_run_error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/_temporary_exploratory_run_error.txt
            git commit -m "debug: capture exploratory workflow exception"
            git push origin HEAD:research/exploratory-metric-coupling-2026-10-26
            exit 1
          fi
      - name: Verify the regenerated evidence deterministically
        run: python src/analysis/metric_relationships.py --root . --verify
      - name: Commit only the exploratory artifacts to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/exploratory/analysis_provenance.json \
                  results/exploratory/issue_allocation_effects.csv \
                  results/exploratory/metric_coupling_summary.csv \
                  results/exploratory/length_quartile_effects.csv \
                  results/exploratory/robustness_summary.csv \
                  results/figures/metric_coupling_1888.png \
                  results/figures/length_quartiles_1888.png
          if git diff --cached --quiet; then
            echo "All research evidence already committed"
          else
            git commit -m "results: regenerate and certify exploratory evidence"
            git push origin HEAD:research/exploratory-metric-coupling-2026-10-26
          fi
