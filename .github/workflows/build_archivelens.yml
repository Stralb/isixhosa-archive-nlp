name: Build ArchiveLens research evidence

on:
  push:
    branches:
      - research/archivelens-claim-stability-2026-10-26
    paths:
      - .github/workflows/build_archivelens.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Run synthetic control tests
        run: python -m unittest discover -s src/archivelens -p 'test_*.py' -v
        env:
          PYTHONPATH: src
      - name: Build full counterfactual audit from verified original archive
        run: |
          python src/archivelens/audit.py \
            --data data/TxtLangFiles1870-1894_TB.zip \
            --out results/archivelens \
            --figures results/figures \
            --report reports/ARCHIVELENS_RESULTS_2026-10-26.md
      - name: Independently verify 960 contrasts and selection ranking
        run: |
          python src/archivelens/verify_independent.py \
            --data data/TxtLangFiles1870-1894_TB.zip \
            --out results/archivelens
      - name: Fresh-run deterministic verification
        run: |
          python src/archivelens/audit.py \
            --data data/TxtLangFiles1870-1894_TB.zip \
            --out results/archivelens \
            --figures results/figures \
            --report reports/ARCHIVELENS_RESULTS_2026-10-26.md \
            --verify
      - name: Commit only new ArchiveLens research results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/archivelens/audit.json \
                  results/archivelens/candidate_1887.csv \
                  results/archivelens/claims.csv \
                  results/archivelens/estimands.csv \
                  results/archivelens/explorer.html \
                  results/figures/archivelens_claim_sensitivity.png \
                  results/figures/archivelens_claim_sensitivity.svg \
                  reports/ARCHIVELENS_RESULTS_2026-10-26.md
          if git diff --cached --quiet; then
            echo "ArchiveLens artifacts already committed"
          else
            git commit -m "results(archivelens): verified 1885-1888 claim stability audit"
            git push origin HEAD:research/archivelens-claim-stability-2026-10-26
          fi
