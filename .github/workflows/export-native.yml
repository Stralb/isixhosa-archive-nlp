name: Materialize native research outputs for repository cleanup

on:
  push:
    branches:
      - refactor/clean-research-layout
    paths:
      - .github/workflows/export-native.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the original saved archives
        run: |
          python scripts/restore_saved_artifacts.py --verify-only
          python scripts/restore_saved_outputs.py --verify-only
      - name: Recreate native models, CSV results and PNG figures
        run: |
          python scripts/restore_saved_artifacts.py
          python scripts/restore_saved_outputs.py
          python scripts/verify_saved_results.py
          python scripts/recalculate_saved_contrasts.py
      - name: Commit native research evidence on the refactor branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f coursework/isiXhosa_Excellence_Sprint/Phase{1..6}/outputs
          if git diff --cached --quiet; then
            echo "Native files already exist in Git"; exit 0
          fi
          git commit -m "Materialize direct CSV scores and binary models before cleanup"
          git push origin HEAD:refactor/clean-research-layout
