name: Build CCN paper draft

on:
  push:
    branches:
      - paper/official-ccn-draft-and-template-sources-2026-10-26
    paths:
      - 'reports/report.tex'
      - 'reports/paper_references.bib'
      - 'reports/ccn.sty'
      - 'reports/neurips_checklist_filled.tex'
      - 'reports/make_figure.py'
      - '.github/workflows/build_paper_draft.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Verify exact original template ZIP bytes
        shell: bash
        run: |
          printf '%s\n' '6fcc74188f418b9e6e35fa76837c34abd5b065b78c8287f2a3ea606026af5f55  reports/original_templates/CCN_Extended_Abstract_Original.zip' '9e21a868b448b31f978e90c21e8aa2b61e766b11b94fc907cae13bf0c9871e66  reports/original_templates/NeurIPS_2024_Checklist_Original.zip' | sha256sum -c -

      - name: Regenerate plot from pinned verified statistics
        run: python reports/make_figure.py
      - name: Compile through TeX Live
        uses: xu-cheng/latex-action@v4
        with:
          root_file: report.tex
          working_directory: reports
          latexmk_use_lualatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Verify two-page scientific body before references
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pypdf
          python - <<'PY'
          from pypdf import PdfReader
          r=PdfReader("reports/report.pdf")
          assert len(r.pages)>=4, "Missing references/checklist/declarations"
          p1=(r.pages[0].extract_text() or "")
          p2=(r.pages[1].extract_text() or "")
          p3=(r.pages[2].extract_text() or "")
          assert "Abstract" in p1, "Abstract must start on page 1"
          assert "Discussion" in p2 and "Conclusion" in p2, "Core paper overflows its two-page limit"
          assert "References" not in p1+p2, "References begin before two-page body ends"
          assert "References" in p3, "Bibliography does not begin on page 3"
          assert any("NeurIPS" in (p.extract_text() or "") for p in r.pages[3:]), "Checklist missing"
          assert any("Contribution Statement" in (p.extract_text() or "") for p in r.pages[3:]), "Contribution declaration missing"
          print("PASS: CCN scientific body fills two pages; bibliography begins on page 3; ethics/checklist sections present; total pages",len(r.pages))
          PY
      - name: Commit explicitly labelled unreviewed PDF draft
        shell: bash
        run: |
          set -euo pipefail
          cp reports/report.pdf reports/ccn_extended_abstract_DRAFT.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ccn_extended_abstract_DRAFT.pdf
          if git diff --cached --quiet; then
            echo 'Draft PDF already in sync'
          else
            git commit -m "paper: publish compiled CCN draft PDF (author review required)"
            git push origin HEAD:paper/official-ccn-draft-and-template-sources-2026-10-26
          fi
      - name: Upload compiled PDF for review
        uses: actions/upload-artifact@v4
        with:
          name: NLP2-CCN-draft-PDF-needs-author-review
          path: reports/report.pdf
          retention-days: 14
